name: Backend

on:
  push:
    branches: [main, testing, development]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [main, testing, development]
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sopa_test
          POSTGRES_USER: sopa
          POSTGRES_PASSWORD: sopa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sopa -d sopa_test"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y probar
        run: mvn -B verify
      - name: Guardar el .jar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: sopa-backend-${{ github.ref_name }}
          path: backend/target/sopa-backend-*.jar
          retention-days: 14
